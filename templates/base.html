<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>{% block titulo %}Oficina do Biel{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Sistema da Oficina do Biel</h1>
  <p>
    <a href="{{ url_for('listar') }}">Veiculos</a> |
    <a href="{{ url_for('listar_servicos') }}">Servicos</a> |
    <a href="{{ url_for('sobre') }}">Sobre</a> |
    <a href="{{ url_for('novo') }}">Cadastrar veiculo</a>
  </p>
  <hr>

  {% if msg %}
    <p class="mensagem-sucesso">{{ msg }}</p>
  {% endif %}

  {% block conteudo %}{% endblock %}
</body>
</html>
